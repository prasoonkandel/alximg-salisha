<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Alximg Themes</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        <link rel="stylesheet" href="../style.css" />
        <link rel="stylesheet" href="./style.css" />
    </head>

    <body>
        <header class="header">
            <div class="logo">Alximg</div>

            <nav aria-label="Main navigation">
                <a href="../">HOME</a>
                <a href="./" class="active">THEMES</a>
            </nav>

            <button class="search-btn" type="button" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <a href="./Themes/#theme-search" style="text-decoration: none"
                    >Search</a
                >
            </button>
        </header>

        <main class="themes-page">
            <section class="page-intro" aria-labelledby="themes-page-title">
                <h1 id="themes-page-title">Available Themes</h1>
                <p class="intro-copy">
                    Search among our available themes to find the perfect one
                    for your image generation needs. Each theme is designed to
                    enhance your images with unique styles and effects.
                </p>
            </section>

            <section class="themes-section" aria-labelledby="themes-grid-title">
                <div class="section-header">
                    <h2 id="themes-grid-title">Available Themes</h2>
                </div>

                <div class="themes-toolbar">
                    <label
                        class="theme-search"
                        aria-label="Search available themes"
                    >
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                            type="search"
                            id="theme-search"
                            placeholder="Search themes"
                            aria-label="Search themes"
                        />
                    </label>
                </div>

                <div class="themes-grid" id="themes-grid" aria-live="polite">
                    <p class="themes-empty">No themes available yet.</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>Made by Alxi for Alxis</p>
        </footer>

        <script src="./script.js"></script>
    </body>
</html>
